[project]
name = "ext-tortoise"
version = "1.0.0"
requires-python = ">=3.13.0"
description = "Tortoise-ORM integration extensions"
authors = [
    { name = "phoenix", email = "hypofiasco@gmail.com" },
]

dependencies = [
    "tortoise-orm[asyncpg]>=1.1.9,<2",
    "python-ulid>=3.1.0,<4",
    "loguru>=0.7.3,<1",
    "pydantic>=2.13.1,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ext/ext_tortoise"]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
