[project]
name = "indexing"
version = "1.0.0"
requires-python = ">=3.13.0"
description = "Backend-neutral indexing integrations (PostgreSQL, Elasticsearch, Milvus)"
authors = [
    { name = "phoenix", email = "hypofiasco@gmail.com" },
]

dependencies = [
    "pydantic>=2.14.2,<3",
    "loguru>=0.7.3,<1",
]

[project.optional-dependencies]
postgresql = [
    "asyncpg>=0.31.0,<1",
]
elasticsearch = [
    "elasticsearch[async,orjson]>=8.19.3,<9.0.0",  # pined, because server side
]
milvus = [
    "pymilvus>=2.6.9,<3",
]

all = [
    "indexing[postgresql,elasticsearch,milvus]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ext/indexing"]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
