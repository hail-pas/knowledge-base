[project]
name = "workflow"
version = "1.0.0"
requires-python = ">=3.13.0"
description = "Workflow execution engine and task management"
authors = [
    { name = "phoenix", email = "hypofiasco@gmail.com" },
]

dependencies = [
    "celery>=5.6.3,<6",
    "pydantic>=2.14.2,<3",
    "loguru>=0.7.3,<1",
    "networkx>=3.6.1,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ext/workflow"]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
