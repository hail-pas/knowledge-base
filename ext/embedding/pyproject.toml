[project]
name = "embedding"
version = "1.0.0"
requires-python = ">=3.13.0"
description = "Embedding model integrations"
authors = [
    { name = "phoenix", email = "hypofiasco@gmail.com" },
]

dependencies = [
    "pydantic>=2.14.2,<3",
    "loguru>=0.7.3,<1",
    "httpx>=0.28.1,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ext/embedding"]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
