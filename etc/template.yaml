extensions:
  rdb_knowledge_base:
    url: "mysql+aiomysql://username:pwd@host:port/knowledge_base?charset=utf8mb4"

  redis:
    url: "rediss://username:pwd@host:port/db?ssl_cert_reqs=required&ssl_ca_certs=path/to/file.pem"
    max_connections: 5

  httpx:
    max_connections: 200
    max_keepalive_connections: 80
    timeout: 10

  celery:
    broker_url: "rediss://username:pwd@host:port/db?ssl_cert_reqs=required&ssl_ca_certs=path/to/file.pem"
    result_backend: "rediss://username:pwd@host:port/db?ssl_cert_reqs=required&ssl_ca_certs=path/to/file.pem"

# External identity provider. Access tokens are validated through Pero's OIDC UserInfo endpoint.
user_center:
  base_url: "http://127.0.0.1:8080"
  userinfo_path: "/api/oauth2/userinfo"
  timeout_seconds: 5

# Service settings
server:
  address: "http://0.0.0.0:8000"
  cors:
    allow_origins: ["*"]
    allow_credentials: true
    allow_methods: ["*"]
    allow_headers: ["*"]
    expose_headers: []
  profiling:
    secret: ""
  docs_uri: "/docs"
  redoc_uri: "/redoc"
  openapi_uri: "/openapi.json"

project:
  unique_code: KnowledgeBase
  debug: true
  sentry_dsn: null
